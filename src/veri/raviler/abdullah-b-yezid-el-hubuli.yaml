    kaynak: &mz { ad: "Mizzî, Tehzîbü'l-Kemâl, 16/316-317 (Abdullah b. Yezîd el-Meâfirî)", url: "https://shamela.ws/book/3722/8310" }
  - kisi: cabir-b-abdullah
