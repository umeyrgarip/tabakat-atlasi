isim: Alkame b. Kays
tam_isim: Ebû Şibl Alkame b. Kays b. Abdillâh en-Nehaî
arapca: علقمة بن قيس النخعي
cerh_tadil: Sika, sebt, fakih, âbid (İbn Hacer, Takrîb; 2. tabaka)
