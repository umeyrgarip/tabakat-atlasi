vefat: { hicri: 62, miladi: 682, not: "61, 63, 65 ve 72 de denmiştir" }
bolge: kufe
ozet: Abdullah b. Mes'ûd'un en önde gelen talebesi; Kûfe fıkıh ve tefsir mektebinin önde gelen temsilcisi.
biyografi: |
  Resûlullah hayattayken doğduğu hâlde onu görmemiş (muhadram) büyük tâbiîlerdendir. Kûfe'de Abdullah b. Mes'ûd'un kıraat, tefsir ve fıkıhta en önde gelen talebesi oldu; Ebû Şibl künyesini ona hocası vermiştir.

  Ali b. Ebî Tâlib ile Sıffîn'de bulundu. Esved b. Yezîd'in amcasıdır. Nehaî ve Şa'bî'nin hocası olarak Ebû Hanîfe'ye uzanan Kûfe zincirinin önemli halkalarındandır.
