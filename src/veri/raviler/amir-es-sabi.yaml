isim: Âmir eş-Şa'bî
tam_isim: Ebû Amr Âmir b. Şerâhîl eş-Şa'bî el-Hemdânî
arapca: عامر بن شراحيل الشعبي
cerh_tadil: Sika, meşhur, fakih, fâzıl (İbn Hacer, Takrîb; 3. tabaka)
tabaka: tabiin
dogum: { hicri: 19, miladi: 640, not: "17 ile 31 arasında farklı tarihler verilmiştir" }
vefat: { hicri: 104, miladi: 722, not: "103 ile 110 arasında farklı tarihler verilmiştir" }
bolge: kufe
ozet: Çok sayıda sahâbîye yetişen Kûfeli muhaddis; Kûfe'de rivayete dayanan yaklaşımın temsilcisi.
biyografi: |
  Kûfe'de doğdu; kendi ifadesine göre beş yüz sahâbî gördü ve yetmişten fazlasından hadis öğrendi. Hadis, megâzî ve ferâizde otorite kabul edildi; Ömer b. Abdülazîz'in isteğiyle bir yıl Kûfe kadılığı yaptı.

  Aynı dönemde Kûfe'de Nehaî re'y ekolünü, Şa'bî ise rivayete dayanan yaklaşımı temsil ediyordu.
