vefat: { hicri: 126, miladi: 744, not: "125 de denmiştir" }
bolge: mekke
ozet: Atâ'dan sonra Mekke'nin fetva mercii; iki Süfyân'ın ve İmam Mâlik'in hocası.
biyografi: |
  Aslen İranlıdır; Cumah kabilesinin himayesine girdiği için velâ yoluyla mevâlîdendir. İbn Abbâs ve Câbir gibi sahâbîlerden, Tâvûs, Mücâhid, İkrime, Atâ ve Vehb b. Münebbih gibi tâbiîlerden hadis dinledi.

  Atâ'dan sonra Mekke'nin fetva mercii oldu. Güvenilirliği konusunda hadis otoriteleri ittifak etmiştir; hadis alanında eser veren ilk altı kişiden biri olarak anılır. İmam Mâlik, Süfyân es-Sevrî ve Süfyân b. Uyeyne ondan rivayette bulunmuştur.
