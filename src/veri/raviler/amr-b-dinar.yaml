isim: Amr b. Dînâr
tam_isim: Ebû Muhammed Amr b. Dînâr el-Mekkî el-Cumahî
arapca: عمرو بن دينار
cerh_tadil: Sika, sebt (İbn Hacer, Takrîb; 4. tabaka)
tabaka: tabiin
