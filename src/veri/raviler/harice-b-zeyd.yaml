isim: Hârice b. Zeyd
tam_isim: Ebû Zeyd Hârice b. Zeyd b. Sâbit el-Ensârî en-Neccârî
arapca: خارجة بن زيد بن ثابت
cerh_tadil: Sika, fakih (İbn Hacer, Takrîb; 3. tabaka)
