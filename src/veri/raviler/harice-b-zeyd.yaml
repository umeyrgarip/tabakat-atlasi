bolge: medine
ozet: Vahiy kâtibi Zeyd b. Sâbit'in oğlu; ferâiz ilminde otorite olan Medine fakihi.
biyografi: |
  Ensardan sahâbî Zeyd b. Sâbit'in oğludur. Babasının ferâiz birikimini devam ettirdi; divan kâtipliği alanında da uzman sayıldı.

  Ömer b. Abdülazîz'in Medine valiliği sırasında kurduğu on kişilik danışma meclisinde yer aldı. Vefatında Ömer b. Abdülazîz, onun ölümünün İslâm'da bir boşluk açtığını söylemiştir.
