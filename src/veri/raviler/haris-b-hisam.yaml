ozet: Ebû Cehil'in kardeşi; Mekke'nin fethinde müslüman oldu, Şam fetihlerine katıldı. Vahyin nasıl geldiğini Resûlullah'a soran sahâbî olarak Buhârî'nin Sahîh'inin başında anılır; Ebû Bekr b. Abdirrahmân'ın dedesidir.
