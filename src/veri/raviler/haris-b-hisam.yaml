isim: el-Hâris b. Hişâm
tam_isim: Ebû Abdirrahmân el-Hâris b. Hişâm b. el-Mugîre el-Mahzûmî
arapca: الحارث بن هشام
tabaka: sahabe
vefat: { hicri: 18, miladi: 639, not: "Amvâs vebasında; Yermük'te (15/636) öldüğü de rivayet edilir" }
