ozet: Basra'nın zühd, vaaz ve fıkıh önderi; "Basralıların imamı" diye anılan tâbiî.
biyografi: |
  Medine'de doğdu; annesi Resûlullah'ın hanımı Ümmü Seleme'nin azatlısıydı. Yetmişi Bedir gazisi olmak üzere yüz yirmi kadar sahâbîyle görüştü; bunların başında Enes b. Mâlik gelir. Ali b. Ebî Tâlib'in halifeliğinden sonra ailesiyle Basra'ya yerleşti.

  Bir yıl kadılık yaptıktan sonra ilim ve vaazla meşgul oldu. Zalim yöneticileri cesaretle eleştirmekle birlikte fitneye yol açar endişesiyle isyanlara katılmadı. Fıkhî görüşleri talebeleri aracılığıyla sonraki fıkıh kitaplarına girmiş, kısmen sûfîler kısmen fakihler tarafından benimsenmiştir.
