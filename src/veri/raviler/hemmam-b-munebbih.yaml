diger_bolgeler: [medine]
ozet: Ebû Hüreyre'den derlediği es-Sahîfetü's-sahîha ile ilk yazılı hadis metinlerinden birini bugüne ulaştıran San'alı tâbiî.
biyografi: |
  Yemen'de doğdu; Fars kökenli ebnâdan bir aileye mensuptur ve Vehb b. Münebbih'in kardeşidir. Gençliğinde Medine'ye giderek Ebû Hüreyre'den hadis öğrendi; Muâviye, İbn Abbâs, İbn Zübeyr ve İbn Ömer'den de rivayette bulundu. San'a'da vefat etti.

  Ebû Hüreyre'den öğrendiği hadisleri es-Sahîfetü's-sahîha adlı mecmuada topladı. Allah'ın sıfatlarından ibadet ve ahlâka uzanan konularda 139 kadar hadis içeren sahîfe, Hemmâm'dan Ma'mer b. Râşid'e, ondan Abdürrezzâk es-San'ânî'ye, ondan da Ahmed b. Hanbel, Buhârî ve Müslim gibi muhaddislere ulaştı. Eseri ilk defa Muhammed Hamîdullah yayımladı (1953); bu neşir, hadislerin erken dönemde yazıya da geçirildiğini gösteren önemli bir belge sayılır.
