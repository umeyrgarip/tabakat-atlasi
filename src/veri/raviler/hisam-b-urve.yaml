ozet: Urve b. ez-Zübeyr'in oğlu; babasının rivayetlerini Mâlik, Leys, Sevrî ve Uyeyne'ye aktaran Medineli muhaddis.
biyografi: |
  Muharrem 61'de (Ekim 680) Medine'de doğdu. Sahâbeden İbn Ömer, Sehl b. Sa'd, Câbir ve Enes'i gördü; hadisi başta babası Urve olmak üzere amcası Abdullah b. Zübeyr, Zührî ve hanımı Fâtıma bint Münzir'den rivayet etti.

  İbn Sa'd, İbn Maîn ve Ebû Hâtim onu güvenilir sayar. Halife Mansûr döneminde üç defa Kûfe'ye gitti; Irak'ta yaptığı rivayetlerin Medine'dekiler kadar sağlam olmadığı söylenmiştir. Mâlik, Leys b. Sa'd, Süfyân es-Sevrî ve Süfyân b. Uyeyne ondan hadis aldı. 146 (763) yılında Bağdat'ta vefat etti. Buhârî'nin Sahîh'inin başındaki, el-Hâris b. Hişâm'ın vahyin nasıl geldiğini sorduğu hadis onun rivayetiyledir.
