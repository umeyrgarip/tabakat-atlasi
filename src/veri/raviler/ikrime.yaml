isim: İkrime
tam_isim: Ebû Abdillâh İkrime b. Abdillâh el-Berberî, mevlâ İbn Abbâs
arapca: عكرمة مولى ابن عباس
cerh_tadil: Sika, sebt, tefsir âlimi; İbn Ömer'in onu yalanladığı da bid'atçı olduğu da sabit değildir (İbn Hacer, Takrîb; 3. tabaka)
tabaka: tabiin
dogum: { hicri: 21, miladi: 642, not: "muhtemel tarih" }
vefat: { hicri: 105, miladi: 723, not: "104, 106 ve 107 de denmiştir" }
bolge: mekke
ozet: İbn Abbâs'ın azatlısı; tefsiri en iyi bilen tâbiîlerden, güvenilirliği tartışılmış bir âlim.
biyografi: |
  Aslen Mağribli bir Berberîdir; Basra valisi iken İbn Abbâs'a hediye edildi. Kırk yıl kadar süren tahsili boyunca İbn Abbâs ona Kur'an, fıkıh ve sünneti öğretti; yetiştiğini görünce onu fetva vermekle görevlendirdi.

  Katâde ve Ebû Hâtim, İbn Abbâs'ın talebeleri arasında tefsiri en iyi bilenin İkrime olduğunu söyler. Horasan'dan Mağrib'e kadar pek çok bölgeyi dolaştı. Hadisteki yeri tartışmalıdır: pek çok münekkit onu güvenilir sayarken İmam Mâlik ondan hadis alınmamasını istemiştir.
