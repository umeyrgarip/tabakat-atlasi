isim: Kâsım b. Muhammed
tam_isim: Ebû Muhammed el-Kâsım b. Muhammed b. Ebî Bekr es-Sıddîk et-Teymî
arapca: القاسم بن محمد بن أبي بكر
cerh_tadil: Sika (İbn Hacer, Takrîb; 3. tabakanın büyüklerinden)
