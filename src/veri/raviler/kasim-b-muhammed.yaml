vefat: { hicri: 107, miladi: 725, not: "İbn Hacer'e göre 106; 101 ile 112 arasında farklı tarihler verilmiştir" }
bolge: medine
ozet: Ebû Bekir'in torunu; halası Âişe'nin yanında yetişen Medine fakihi.
biyografi: |
  Osman b. Affân'ın halifeliği döneminde doğdu. Babası öldürülünce bir müddet halası Âişe'nin yanında kaldı ve ondan çok sayıda rivayet aldı.

  Mescid-i Nebevî'de ders halkası vardı. Bilmediği soruları cevaplamaz, görüşünü belirttiğinde bunun kendi görüşü olduğunu vurgulardı. Ömrünün son yıllarında gözlerini kaybetti.
