isim: Katâde b. Diâme
tam_isim: Ebü'l-Hattâb Katâde b. Diâme es-Sedûsî el-Basrî
arapca: قتادة بن دعامة
cerh_tadil: Sika, sebt (İbn Hacer, Takrîb; 4. tabaka)
tabaka: tabiin
dogum: { hicri: 60, miladi: 680, not: "61 de denmiştir" }
vefat: { hicri: 117, miladi: 735, not: "118 de denmiştir" }
bolge: basra
ozet: Güçlü hafızasıyla darbımesel olan âmâ müfessir ve muhaddis.
biyografi: |
  Âmâ olarak doğdu; Sedûs kabilesine mensup bedevî bir ailedendir. Hasan el-Basrî'nin yanında on iki yıl kalarak kıraat, tefsir ve hadis öğrendi. Sahâbeden yalnızca Enes b. Mâlik'ten hadis aldı.

  Güçlü hafızası darbımesel olmuştur; Saîd b. el-Müseyyeb'in yanında sekiz gün kaldıktan sonra Saîd'in "Bende ne varsa aldın" dediği nakledilir. Tefsirde dördüncü tabakanın başı kabul edilir. Vâsıt'taki veba salgınında vefat etti.
