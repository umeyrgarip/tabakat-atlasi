isim: Mücâhid b. Cebr
tam_isim: Ebü'l-Haccâc Mücâhid b. Cebr el-Mekkî el-Mahzûmî
arapca: مجاهد بن جبر
cerh_tadil: Sika; tefsirde ve ilimde imam (İbn Hacer, Takrîb; 3. tabaka)
tabaka: tabiin
dogum: { hicri: 21, miladi: 642 }
vefat: { hicri: 103, miladi: 721, not: "100 ile 107 arasında farklı tarihler verilmiştir" }
bolge: mekke
ozet: İbn Abbâs'ın tefsir alanındaki en önemli talebesi; Mekke tefsir ekolünün öncüsü.
biyografi: |
  Mekke'de doğdu; Kays b. Sâib el-Mahzûmî'nin kölesiydi. Kur'an'ı İbn Abbâs'ın önünde defalarca hatmetti ve onunla birlikte baştan sona üç kez tefsir etti.

  İbn Abbâs'ın vefatından sonra Mekke'deki tefsir derslerini üstlendi ve halkın fetva mercii oldu. İbn Abbâs'tan öğrendiği tefsiri yazıya geçirdi; bu tefsir talebeleri aracılığıyla sonraki tefsirlere ulaştı.
