isim: Muhammed b. Sîrîn
tam_isim: Ebû Bekr Muhammed b. Sîrîn el-Basrî
arapca: محمد بن سيرين
cerh_tadil: Sika, sebt, âbid, kadri büyük; hadisin mana ile rivayetini caiz görmezdi (İbn Hacer, Takrîb; 3. tabaka)
tabaka: tabiin
dogum: { hicri: 34, miladi: 654, not: "31 ve 33 de denmiştir" }
vefat: { hicri: 110, miladi: 729 }
bolge: basra
ozet: Rivayetteki titizliğiyle tanınan Basralı muhaddis ve fakih; sonraki asırlarda rüya tabiriyle meşhur oldu.
biyografi: |
  Basra'da doğdu. Babası Sîrîn, Enes b. Mâlik'in azat ettiği bir esir; annesi Safiyye ise Ebû Bekir'in azatlısıdır. Otuz kadar sahâbîyle görüştü; Zeyd b. Sâbit ve Ebû Hüreyre'den, tâbiîlerden de Kadı Şüreyh ve Abîde es-Selmânî'den ilim aldı.

  Geçimini ticaretle sağladı. Hadisçiliği ve fıkhı ağır basan bir âlimdir; hadisleri lafzıyla aktarmaya özen gösterirdi. Rüya tabirine dair kendisine nisbet edilen eserlerin ona ait olmadığı kabul edilir.
