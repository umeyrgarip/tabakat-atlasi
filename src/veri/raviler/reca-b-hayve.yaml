ozet: Ömer b. Abdülazîz'in veziri; Şamlıların "efendisi" sayılan fakih.
biyografi: |
  Filistin'in Beysân bölgesindendir; Kinde kabilesinin mevlâsıdır. Ömer b. Abdülazîz'in veziri oldu.

  Muâz b. Cebel ve Ebü'd-Derdâ'dan rivayetleri mürseldir. Matar el-Verrâk, Şam'da ondan daha fakih birini görmediğini söyler; Mekhûl de ona "şeyhimiz ve efendimiz" diyerek kendisine sorulan meseleleri ona yönlendirirdi. Hadisleri lafzıyla rivayet etmeye özen gösterenlerdendir.
