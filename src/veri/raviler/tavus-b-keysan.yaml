ozet: Hem Yemen'in hem Mekke'nin fakihleri arasında sayılan, İbn Abbâs'ın seçkin talebesi.
biyografi: |
  Yemen'de doğdu ve Cened şehrinde yaşadı; Yemen'i zapteden Sâsânî askerlerinin soyundan gelen Fars kökenli bir aileye mensuptur. Elli kadar sahâbîye yetişti; en çok İbn Abbâs ile beraber oldu.

  Hem Yemen'in hem Mekke'nin fakihleri arasında sayılır; re'y ile nakli dengeleyen bir fıkıh anlayışı vardı. Emevî idarecilerinden uzak durdu. Ömrünün son yıllarında Mekke'de oturdu ve hac sırasında vefat etti.
