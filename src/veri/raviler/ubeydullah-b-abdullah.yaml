isim: Ubeydullah b. Abdullah b. Utbe
tam_isim: Ebû Abdillâh Ubeydullah b. Abdillâh b. Utbe b. Mes'ûd el-Hüzelî
arapca: عبيد الله بن عبد الله بن عتبة
cerh_tadil: Sika, fakih, sebt (İbn Hacer, Takrîb; 3. tabaka)
tabaka: tabiin
vefat: { hicri: 98, miladi: 716, not: "94 ile 102 arasında farklı tarihler verilmiştir" }
bolge: medine
ozet: Ömer b. Abdülazîz'in hocası; "şairlerin en fakihi" diye anılan Medine fakihi.
biyografi: |
  Dedesi Utbe, Abdullah b. Mes'ûd'un kardeşidir. Uzun süre yanında bulunduğu İbn Abbâs başta olmak üzere sahâbeden ilim aldı; İbn Mes'ûd'un vefatında çocuk olduğu için ondan doğrudan rivayeti yoktur.

  Ömer b. Abdülazîz ile Zeynelâbidîn onun talebesidir. Âmâ idi; şiirdeki ustalığı sebebiyle "şairlerin en fakihi, fakihlerin en şairi" diye anılmıştır.
