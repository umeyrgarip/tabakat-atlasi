ozet: Mısır'da fıkıh eğitimini ilk başlatan âlim; Leys b. Sa'd'ın en önemli hocası.
biyografi: |
  Babası Sudan Nûbesi'ndeki Dongola'dan esir alınıp Mısır'a getirilmişti; kendisi köle olarak doğdu, sonra azat edildi. Fustat'ta yetişti; İskenderiye kadısı Ebü'l-Hayr Mersed, İkrime ve Atâ gibi tâbiîlerden ilim aldı.

  Mısır'da helal ve haramı öğreten, fetva veren ilk âlim olarak tanınır. Ömer b. Abdülazîz'in Mısır'da fetva vermekle görevlendirdiği üç kişiden biridir. En önemli talebesi Leys b. Sa'd'dır.
